<div class="col-6">
    <div class="mb-3">
        <form action="">

            <div class="form-group pt-4">
                <label for="num1">Ingresa el valor 1:</label>
                <input [(ngModel)]="num1" type="number" name="num1" class="form-control" id="num1"
                    placeholder="Ingresa numero 1">
            </div>

            <div class="form-group pt-4">
                <label for="num2">Ingresa el valor 2:</label>
                <input [(ngModel)]="num2" type="number" name="num2" class="form-control" id="num2"
                    placeholder="Ingresa numero 2">
            </div>

            <h5>Selecciona una figura:</h5>

            <input type="radio" name="operacion" value="cuadrado" [(ngModel)]="operacion">
            <label>Cuadrado</label>

            <br>

            <input type="radio" name="operacion" value="rectangulo" [(ngModel)]="operacion">
            <label>Rectángulo</label>

            <br>

            <input type="radio" name="operacion" value="circulo" [(ngModel)]="operacion">
            <label>Círculo</label>

            <br>

            <input type="radio" name="operacion" value="pentagono" [(ngModel)]="operacion">
            <label>Pentágono</label>

            <br>

            <input type="radio" name="operacion" value="triangulo" [(ngModel)]="operacion">
            <label>Triángulo</label>

            <br><br>

            <button (click)="calcular()" type="button" class="btn btn-primary">
                Calcular
            </button>

            <h4>Resultado: {{ resultado }}</h4>

        </form>
    </div>
</div>
