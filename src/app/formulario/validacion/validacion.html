<div class="col-6">
    <div class="mb-3">
        <form action="">

            <div class="form-group pt-4">
                <label for="usuario">Usuario:</label>

                <input [(ngModel)]="usuario"
                    type="text"
                    name="usuario"
                    class="form-control"
                    id="usuario"
                    placeholder="Ingresa tu usuario">
            </div>
            <div class="form-group pt-4">
                <label for="contrasena">Contraseña:</label>

                <input [(ngModel)]="contrasena"
                    type="password"
                    name="contrasena"
                    class="form-control"
                    id="contrasena"
                    placeholder="Ingresa tu contraseña">
            </div>
            <br>

            <button (click)="validar()"
                type="button"
                class="btn btn-primary">
                Iniciar sesión
            </button>

            <br><br>
            <h4>{{ mensaje }}</h4>

        </form>
    </div>
</div>
