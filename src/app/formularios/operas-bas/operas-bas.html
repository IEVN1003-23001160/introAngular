    <form>
      <div class="form-group pt-4">
        <label for="num1">Numero 1:</label>
        <input [(ngModel)]="num1" type="text" name="num1" class="form-control" id="num1" placeholder="Ingresa numero 1">
      </div>

      <div class="form-group pt-4">
        <label for="num2">Numero 2:</label>
        <input [(ngModel)]="num2" type="text" name="num2" class="form-control" id="num2" placeholder="Ingresa numero 2">
      </div>

      <br>

      <h5>Selecciona una operación:</h5>

      <input type="radio" name="operacion" value="suma" [(ngModel)]="operacion">
      <label>Suma</label>

      <br>

      <input type="radio" name="operacion" value="resta" [(ngModel)]="operacion">
      <label>Resta</label>

      <br>

      <input type="radio" name="operacion" value="multiplicacion" [(ngModel)]="operacion">
      <label>Multiplicación</label>

      <br>

      <input type="radio" name="operacion" value="division" [(ngModel)]="operacion">
      <label>División</label>

      <br><br>

      <button (click)="calcular()" type="button" class="btn btn-primary">
        Calcular
      </button>
    </form>

  </div>

  <div class="col-6">
    <h2>Resultado: {{resultado}}</h2>
  </div>

  <hr>

  <h3>Distancia entre dos puntos</h3>

  <div class="mb-3">

    <form>

      <div class="form-group pt-4">
        <label for="num3">Coordenada X1:</label>
        <input [(ngModel)]="num3" type="number" name="num3" class="form-control" id="num3" placeholder="Ingresa X1">
      </div>

      <div class="form-group pt-4">
        <label for="num4">Coordenada Y1:</label>
        <input [(ngModel)]="num4" type="number" name="num4" class="form-control" id="num4" placeholder="Ingresa Y1">
      </div>

      <div class="form-group pt-4">
        <label for="valorx">Coordenada X2:</label>
        <input [(ngModel)]="valorx" type="number" name="valorx" class="form-control" id="valorx"
          placeholder="Ingresa X2">
      </div>

      <div class="form-group pt-4">
        <label for="valory">Coordenada Y2:</label>
        <input [(ngModel)]="valory" type="number" name="valory" class="form-control" id="valory"
          placeholder="Ingresa Y2">
      </div>

      <br>

      <button (click)="distancia()" type="button" class="btn btn-primary">
        Calcular distancia
      </button>
    </form>
  </div>

</div>
