<div class="card">
    <div class="card-header">
        <h1>Herores Dragon Ball</h1>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-2">Filtrar por:</div>
            <div class="col-md-4">
                <input [(ngModel)]="listFilter" type="text" class="form-control" placeholder="Ingrese nombre del heroe">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <h3>Filtro: {{listFilter}}</h3>
            </div>
        </div>


        <div class="table-responsive">
            <table class="table table-striped" *ngIf="heroes.length>0">
                <thead>
                    <tr>
                        <th>
                        <button (click)="showImage()" class="btn btn-primary">
                            {{ muestraImagen ? 'Ocultar' : 'Mostrar' }} Imagen
                        </button>
                        </th>
                        <th>nombre</th>
                        <th>Descripcion</th>
                        <th>Raza:</th>
                        <th>Ki</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let heroe of heroes | heroesFilter:listFilter">
                        <td><img *ngIf="muestraImagen" [src]="heroe.imagen"
                            [style.width.px]="imagenWidth"
                            [style.margin.px]="imagenMargin"
                            ></td>
                        <td>{{heroe.nombre}}</td>
                        <td>{{heroe.descripcion}}</td>
                        <td>{{heroe.race}}</td>
                        <td>{{heroe.ki}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
